[package]
name = "atlassian-mcp"
version = "0.1.0"
edition = "2024"
description = "Read-only MCP server for Atlassian Jira and Confluence (Cloud)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rtmo0/mcp-atlassian"
readme = "README.md"
keywords = ["mcp", "jira", "confluence", "atlassian"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
htmd = "0.5.6"
mime_guess = "2.0.5"
moka = { version = "0.12.16", features = ["future"] }
prometheus = { version = "0.14.0", default-features = false }
regex = "1.12.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "charset", "query"] }
rmcp = { version = "3.8.0", features = ["server", "macros", "schemars", "transport-streamable-http-server", "transport-io"] }
schemars = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
subtle = "2.6.1"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
wiremock = "0.6.5"

[profile.release]
strip = true
